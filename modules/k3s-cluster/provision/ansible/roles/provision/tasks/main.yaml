---
- name: Install kernel-modules-extra package
  ansible.builtin.shell: dnf install -y kernel-modules-extra-$(uname -r)
  changed_when: false
  when:
    ansible_facts['os_family'] == "RedHat" and
    ansible_facts['distribution_major_version'] == "10"

- name: Load required kernel modules
  community.general.modprobe:
    name: "{{ item }}"
    state: present
    persistent: present
  loop:
    - br_netfilter
    - xt_conntrack
    - xt_comment
  when:
    ansible_facts['os_family'] == "RedHat" and
    ansible_facts['distribution_major_version'] == "10"

- name: Install git
  ansible.builtin.package:
    name: git
    state: present

- name: Install cifs-utils
  ansible.builtin.package:
    name: cifs-utils
    state: present

- name: Set `virt_use_samba` SELinux boolean
  ansible.posix.seboolean:
    name: virt_use_samba
    state: true
    persistent: true
  when: ansible_facts['os_family'] == "RedHat"

- name: Install python3-pip
  ansible.builtin.package:
    name: python3-pip
    state: present

- name: Install python3-packaging
  ansible.builtin.package:
    name: python3-packaging
    state: present

- name: Install python kubernetes client
  ansible.builtin.pip:
    name: kubernetes==33.1.0
    state: present

- name: Download Helm install script
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3
    dest: /tmp/get_helm.sh
    mode: "0755"

- name: Install Helm
  ansible.builtin.command:
    cmd: /tmp/get_helm.sh
  environment:
    HELM_INSTALL_DIR: /usr/bin
  changed_when: false
